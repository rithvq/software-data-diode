name: software-data-diode-phase1

x-common: &common
  build:
    context: .
    dockerfile: phase1/Dockerfile
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=32m,mode=1777"]
  mem_limit: 256m
  cpus: "0.5"
  pids_limit: 128
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-health: &health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
  interval: 3s
  timeout: 3s
  retries: 15
  start_period: 5s

services:
  edge-device:
    <<: *common
    command: ["python", "-m", "phase1.device"]
    environment:
      PHASE1_DEVICE_SEED: "101"
      PHASE1_DEVICE_INTERVAL: "1"
    networks: [edge-network]
    depends_on:
      edge-gateway:
        condition: service_healthy

  edge-gateway:
    <<: *common
    environment:
      PHASE1_ROLE: edge-gateway
      PHASE1_QUEUE_CAPACITY: "100"
    volumes: ["edge-gateway-logs:/logs"]
    networks: [edge-network, gateway-network]
    healthcheck: *health
    depends_on:
      unidirectional-gateway:
        condition: service_healthy

  unidirectional-gateway:
    <<: *common
    environment:
      PHASE1_ROLE: unidirectional-gateway
      PHASE1_QUEUE_CAPACITY: "100"
    volumes: ["unidirectional-gateway-logs:/logs"]
    networks: [gateway-network, fog-network]
    healthcheck: *health
    depends_on:
      fog-receiver:
        condition: service_healthy

  fog-receiver:
    <<: *common
    environment:
      PHASE1_ROLE: fog-receiver
    volumes: ["fog-receiver-logs:/logs"]
    networks: [fog-network]
    healthcheck: *health

networks:
  edge-network:
    internal: true
  gateway-network:
    internal: true
  fog-network:
    internal: true

volumes:
  edge-gateway-logs:
  unidirectional-gateway-logs:
  fog-receiver-logs:
